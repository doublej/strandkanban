<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark" />
		<meta name="theme-color" content="#15110d" />
		<link rel="icon" href="%sveltekit.assets%/icon.svg" />
		<link rel="preload" href="%sveltekit.assets%/fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="%sveltekit.assets%/fonts/martian-mono.woff2" as="font" type="font/woff2" crossorigin />
		<style>
			@font-face {
				font-family: 'Fraunces';
				font-style: normal;
				font-weight: 100 900;
				font-display: swap;
				src: url('%sveltekit.assets%/fonts/fraunces.woff2') format('woff2');
			}
			@font-face {
				font-family: 'Martian Mono';
				font-style: normal;
				font-weight: 100 800;
				font-stretch: 75% 112.5%;
				font-display: swap;
				src: url('%sveltekit.assets%/fonts/martian-mono.woff2') format('woff2');
			}
		</style>
		<meta name="description" content="strandkanban is a drag-and-drop Kanban board for the Beads issue tracker. Every edit goes through the bd CLI." />
		<meta property="og:title" content="strandkanban" />
		<meta property="og:description" content="A live Kanban board for Beads issues, with agent panes next to it." />
		<meta property="og:type" content="website" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<script defer src="https://doublej.github.io/doublej-project-linking/widget.js"></script>
	</body>
</html>
