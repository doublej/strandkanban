<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light" />
		<meta name="theme-color" content="#fafafa" />
		<link rel="icon" href="%sveltekit.assets%/icon.svg" />
		<link rel="preload" href="%sveltekit.assets%/fonts/instrument-sans.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="%sveltekit.assets%/fonts/dm-mono.woff2" as="font" type="font/woff2" crossorigin />
		<style>
			@font-face {
				font-family: 'Instrument Sans';
				font-style: normal;
				font-weight: 400 700;
				font-display: swap;
				src: url('%sveltekit.assets%/fonts/instrument-sans.woff2') format('woff2');
			}
			@font-face {
				font-family: 'DM Mono';
				font-style: normal;
				font-weight: 400;
				font-display: swap;
				src: url('%sveltekit.assets%/fonts/dm-mono.woff2') format('woff2');
			}
		</style>
		<meta name="description" content="strandkanban is a drag-and-drop Kanban board for the Beads issue tracker. Every edit goes through the bd CLI." />
		<meta property="og:title" content="strandkanban" />
		<meta property="og:description" content="A live Kanban board for Beads issues, with agent panes next to it." />
		<meta property="og:type" content="website" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<script defer src="https://doublej.github.io/doublej-project-linking/widget.js"></script>
	</body>
</html>
